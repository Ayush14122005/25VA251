       function changeColor() {
            let inputValue=document.getElementById("inputData").value;

            let inputText=document.getElementById('text');

            inputText.innerHTML=inputValue;

            inputText.style.color="red";

            // for random color

            inputText.style.backgroundColor="#"+Math.floor(Math.random() * 1677725).toString(16);
       }


       // TIFE:-An IIFE is a JavaScript function that runs immediately after it is defined.
// It’s often used to create a private scope and avoid polluting the global namespace.
         (function() {
          console.log("This is an IIFE");
         })();

         // short code for above function
         (msg=>console.log("An IIFE "))();
         console.log(typeof(msg));

         //local storage:-Local storage is a web storage mechanism that allows websites to store data in the user's browser. 
         // It provides a way to save key-value pairs in a web browser with no expiration date, meaning the data persists 
         // even after the browser is closed and reopened.   

         let myInfo={
            name:"ayush",
            age: 20,
            city: "delhi",
            mod: 78900345342,
        };

        // convert obnject into json string
        let myInfoData=JSON.stringify(myInfo);

        // set the data
        localStorage.setItem('prefrences',myInfoData);

        // get data
        let myprefrences=localStorage.getItem('prefrences');

        // retreive the data and convert into JSON object
        let myInfopre=JSON.parse(myprefrences);

        // access keys
        console.log(myInfopre.name);


            
    </script>
